name: mobile_app
description: "Rice grade classification app for the CNN capstone project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0                # talks to the FastAPI backend
  image_picker: ^1.2.2        # camera and gallery
  shared_preferences: ^2.5.5  # offline copy of the prediction history

  # Not used directly by this app, but Flutter's built-in text selection menu
  # draws icons from it. Removing it makes every build print a font warning.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
